name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Back-end
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Back-end

    # SQL Server efemero, so para os testes (contextLoads precisa de DataSource)
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiPassw0rd123Strong
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiPassw0rd123Strong -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    env:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://localhost:1433;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: CiPassw0rd123Strong
      SPRING_SESSION_JDBC_INITIALIZE_SCHEMA: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Permissao do mvnw
        run: chmod +x mvnw

      - name: Build e testes
        run: ./mvnw -B clean verify

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: Back-end/target/surefire-reports

      - name: Publicar jar
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: Back-end/target/*.jar
          if-no-files-found: error

  frontend:
    name: Front-end ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [ web, mobile ]

    defaults:
      run:
        working-directory: Front-end/${{ matrix.app }}

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Verifica se a pasta e o package.json existem
      - name: Verificar se o projeto existe
        id: check_project
        run: |
          if [ -f "Front-end/${{ matrix.app }}/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Projeto Front-end/${{ matrix.app }} não encontrado. Pulando steps."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        working-directory: .

      # 2. Configura Node apenas se o projeto existir
      - name: Setup Node 20
        if: steps.check_project.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Front-end/${{ matrix.app }}/package-lock.json

      # 3. Demais steps só rodam se o projeto existir
      - name: Instalar dependencias
        if: steps.check_project.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.check_project.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Checagem de tipos (TypeScript)
        if: steps.check_project.outputs.exists == 'true'
        run: |
          if [ -f tsconfig.json ]; then npx tsc --noEmit; else echo "Sem tsconfig.json, pulando"; fi

      - name: Testes
        if: steps.check_project.outputs.exists == 'true'
        run: npm test --if-present -- --watchAll=false

      - name: Build (web)
        if: steps.check_project.outputs.exists == 'true' && matrix.app == 'web'
        run: npm run build --if-present

      - name: Publicar build do web
        if: steps.check_project.outputs.exists == 'true' && matrix.app == 'web' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            Front-end/web/build
            Front-end/web/dist
          if-no-files-found: warn