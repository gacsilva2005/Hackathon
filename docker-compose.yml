services:
  # Banco de Dados SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hackathon-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CiPassw0rd123Strong"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiPassw0rd123Strong -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network

  # Aplicação (Front-end compilado + Back-end Spring Boot)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackathon-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=master;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: CiPassw0rd123Strong
      SPRING_SESSION_JDBC_INITIALIZE_SCHEMA: always
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - app-network

volumes:
  sqlserver-data:

networks:
  app-network:
    driver: bridge